name: Notebooks
run-name: ${{ github.actor }} — notebooks

# Notebook tests are slow (they spin up kernels and solve OpenMDAO models), so run
# them only when code lands on main (i.e. on merge), not on every branch push or
# pull request.
on:
  push:
    branches: [main]

jobs:
  test-nb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          environments: dev
          pixi-version: v0.71.1
          cache: true
          cache-write: ${{ github.ref_name == 'main' }}

      - name: Run notebook tests
        run: pixi run -e dev test-nb
