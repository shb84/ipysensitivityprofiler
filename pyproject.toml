[project]
name = "ipysensitivityprofiler"
dynamic = ["version"]
authors = [{name = "Steven H. Berguin", email = "stevenberguin@gmail.com"}]
description = "Jupyter Widgets for visualizing local sensitivity profiles of functions."
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.10"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Framework :: Jupyter",
]
dependencies = ["numpy", "bqplot", "ipywidgets", "traitlets"]

[project.urls]
Documentation = "https://shb84.github.io/ipysensitivityprofiler/"
Homepage = "https://github.com/shb84/ipysensitivityprofiler"
Issues = "https://github.com/shb84/ipysensitivityprofiler/issues"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

# setuptools ###################################################################
[tool.setuptools.dynamic]
version = {attr = "ipysensitivityprofiler.__version__"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["ipysensitivityprofiler*"]
exclude = ["ipysensitivityprofiler.tests*"]
namespaces = false

# mypy #########################################################################
[tool.mypy]
cache_dir = "build/.cache/mypy"
sqlite_cache = true
allow_redefinition = true
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
show_error_codes = true
show_error_context = true
warn_return_any = false
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["openmdao"]
ignore_missing_imports = true

# ruff #########################################################################
[tool.ruff]
target-version = "py310"
cache-dir = "build/.cache/ruff"
include = [
  "docs/**/*.py",
  "notebooks/**/*.py",
  "notebooks/**/*.ipynb",
  "src/**/*.py",
  "tests/**/*.py",
]
line-length = 88
preview = true

[tool.ruff.format]
line-ending = "lf"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "ANN001",
  "ANN002",
  "ANN003",
  "ANN401",  # widget/traitlets callbacks legitimately take **kwargs: Any
  "ANN201",
  "ANN202",
  "ANN204",
  "ARG002",
  "B007",
  "C408",
  "COM812",
  "CPY001",
  "D104",
  "D107",
  "D203",
  "D205",
  "D211",
  "D213",
  "D401",
  "D404",
  "D413",    # conflicts with docformatter, which strips the trailing blank line
  "DOC201",
  "DOC501",
  "E501",
  "EM101",
  "EM102",
  "ERA001",
  "FBT001",
  "FBT002",
  "FBT003",
  "FIX002",
  "ISC001",
  "N803",
  "N812",    # project idiom: `import ipywidgets as W`, `traitlets as T`, `traittypes as TT`
  "N806",
  "NPY002",
  "PD011",
  "PERF102",
  "PLR0913",
  "PLR0917",
  "PLR2004",
  "PLR6201",
  "PLR6301",
  "PLR0914",
  "PT028",
  "RET504",
  "S101",    # asserts are internal invariant checks, not input validation
  "RUF059",
  "T201",
  "TD002",
  "TD003",
  "TRY003",
]

[tool.ruff.lint.per-file-ignores]
"**/*.ipynb" = ["CPY001"]
# Tests deliberately exercise the package's internal modules.
"tests/**/*.py" = ["PLC2701"]
"docs/**/*.py" = ["INP001", "A001"]
"notebooks/**/*.py" = ["INP001", "PLC2701"]
"notebooks/**/*.ipynb" = ["PLC2701"]

# docformatter #################################################################
[tool.docformatter]
close-quotes-on-newline = true
